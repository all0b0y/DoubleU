services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doubleu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doubleu}
      POSTGRES_DB: ${POSTGRES_DB:-doubleu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/migrations:ro
      - ./infra/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-go
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://doubleu:doubleu@postgres:5432/doubleu?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_BASE_URL: ${AI_SERVICE_URL:-http://ai-service:8090}
      BACKEND_HTTP_ADDR: ":8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_AUTO_SETUP: ${TELEGRAM_AUTO_SETUP:-false}
      MINIAPP_DIR: /app/miniapp
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./infra/migrations:/migrations:ro
      - ./miniapp:/app/miniapp:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-python
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://doubleu:doubleu@postgres:5432/doubleu?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_HOST: "0.0.0.0"
      AI_PORT: "8090"
      MOCK_LLM: ${MOCK_LLM:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-30}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-DoubleU}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-}
    ports:
      - "${AI_SERVICE_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
