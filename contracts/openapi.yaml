openapi: 3.1.0
info:
  title: DoubleU Technical MVP Contract
  version: 0.1.0
paths:
  /ai/draft-role:
    post:
      summary: Generate an editable AI-role draft from a free-text description.
      operationId: draftRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRoleRequest"
      responses:
        "200":
          description: Structured role draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftRoleResponse"
  /ai/process-message:
    post:
      summary: Process a normalized Telegram message and return an AI decision proposal.
      operationId: processMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIProcessMessageRequest"
      responses:
        "200":
          description: AI process response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIProcessMessageResponse"
components:
  schemas:
    DraftRoleRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
        trace_id: { type: string }
    DraftRoleResponse:
      type: object
      required: [name, description, speaking_style, goals, constraints, custom_fields]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, minLength: 1 }
        speaking_style: { type: string }
        goals: { type: string }
        constraints: { type: string }
        custom_fields:
          type: array
          items:
            type: object
            required: [title, description]
            properties:
              title: { type: string, minLength: 1, maxLength: 64 }
              description: { type: string, minLength: 1 }
              context: { type: string, maxLength: 5000 }
    NormalizedTelegramEvent:
      type: object
      required:
        - event_id
        - tenant_id
        - chat_id
        - telegram_update_id
        - business_connection_id
        - source_message_id
        - sender_id
        - message_text
        - message_type
        - created_at
      properties:
        event_id: { type: string }
        tenant_id: { type: string }
        chat_id: { type: string }
        telegram_update_id: { type: integer, format: int64 }
        business_connection_id: { type: string }
        source_message_id: { type: string }
        sender_id: { type: string }
        message_text: { type: string }
        message_type: { type: string, default: text }
        created_at: { type: string, format: date-time }
        transport:
          type: string
          enum: [business, bot]
          description: >
            Ingestion channel. "business" — Telegram Business webhook,
            "bot" — user-supplied bot via long polling. Absent means
            "business" (events stored before the field existed).
        bot_id:
          type: string
          description: Telegram bot identifier; present only when transport is "bot".
    ChatSettings:
      type: object
      required: [tenant_id, chat_id, mode, privacy_flags]
      properties:
        tenant_id: { type: string }
        chat_id: { type: string }
        mode:
          type: string
          enum: [disabled, silent, manual, semi_auto, auto]
        privacy_flags:
          type: array
          items:
            type: string
            enum: [no_memory, no_training, private, no_summary]
    AIRole:
      type: object
      description: >
        Owner-authored persona the AI plays when answering on the owner's behalf
        in this chat. Absent means the default assistant persona (reply in the
        owner's observed style).
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        speaking_style: { type: string }
        goals: { type: string }
        constraints: { type: string }
        speak_as_owner:
          type: boolean
          default: true
          description: >
            true (default): the AI impersonates the owner — the contact perceives
            the reply as written by a human. false: the AI replies openly as the
            role persona (assistant/companion), without owner impersonation.
        model_tier:
          type: string
          enum: [fast, balanced, smart]
          default: balanced
          description: >
            LLM quality tier for this role's draft generation.
            fast: low-latency, lower cost (MODEL_TIER_FAST env list).
            balanced: default production quality (MODEL_TIER_BALANCED).
            smart: highest capability, highest cost (MODEL_TIER_SMART).
            Absent or unrecognised value falls back to the task-level
            MODEL_DRAFT / OPENROUTER_MODEL (backward-compatible).
        tool_settings:
          type: object
          additionalProperties:
            type: boolean
          default: {}
          description: >
            Per-role native-tool overrides keyed by catalog key. Missing keys
            inherit the tool catalog's default_enabled value.
        context:
          type: string
          description: >
            Owner-supplied reference material for the role (FAQ, pricing, docs).
            Plain text injected into the draft prompt.
        custom_fields:
          type: array
          description: >
            Owner-defined extra role attributes beyond the fixed fields. Each is
            injected into the persona prompt.
          items:
            type: object
            required: [title, description]
            properties:
              title: { type: string }
              description: { type: string }
              context: { type: string }
    AIProcessMessageRequest:
      type: object
      required: [request_id, event, chat_settings, memory_context]
      properties:
        request_id: { type: string }
        event:
          $ref: "#/components/schemas/NormalizedTelegramEvent"
        chat_settings:
          $ref: "#/components/schemas/ChatSettings"
        memory_context:
          type: array
          items: { type: string }
        ai_role:
          $ref: "#/components/schemas/AIRole"
    AIProcessMessageResponse:
      type: object
      required: [decision, response_text, confidence, risk_level, intent, model_used, usage, memory_used]
      properties:
        decision:
          type: string
          enum: [draft, auto_reply, ignore, observe, ask_owner, error_fallback]
        response_text: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        intent:
          type: string
          enum: [question, scheduling, commercial, acknowledgement, request, choice_question, general_message]
        text_format:
          type: string
          enum: [plain, rich]
          default: plain
        model_used: { type: string }
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
        memory_used:
          type: array
          items: { type: string }
        flagged:
          type: boolean
          description: Output-safety layer flagged the draft (toxicity/sensitive); the bot UI annotates it.
        owner_note:
          type: string
          description: >
            Owner-facing service note (e.g. critical-risk warning). Rendered on the
            owner's card only; MUST NOT be sent to the contact. response_text is
            empty when this is set.
        options:
          type: array
          items: { type: string }
          description: AI-suggested short replies; non-empty only for intent=choice_question.
        response_plan:
          type: object
          required: [shape, options]
          description: Deferred contact-facing form produced by an interaction tool.
          properties:
            shape:
              type: string
              enum: [buttons]
            options:
              type: array
              minItems: 2
              maxItems: 4
              items: { type: string }
        topic:
          type: string
          description: 3-7 word conversation topic from the same draft call (replaces per-message /ai/tag-topic).
    AuditEvent:
      type: object
      required: [audit_id, tenant_id, chat_id, source_message_id, decision, reason, created_at]
      properties:
        audit_id: { type: string }
        tenant_id: { type: string }
        chat_id: { type: string }
        source_message_id: { type: string }
        decision:
          type: string
          enum: [draft, auto_reply, ignore, observe, ask_owner, error_fallback]
        reason: { type: string }
        created_at: { type: string, format: date-time }
