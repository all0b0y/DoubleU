<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.5rem; display: flex; justify-content: center;">
  <div style="width: 320px; background: #14141A; border-radius: 28px; min-height: 620px; display: flex; flex-direction: column; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">

    <div style="padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 0.5px solid #26262F; background: #14141A;">
      <button aria-label="назад" style="background: transparent; border: none; cursor: pointer; padding: 0;">
        <i class="ti ti-chevron-left" style="font-size: 22px; color: #8B8B96;" aria-hidden="true"></i>
      </button>
      <div style="width: 36px; height: 36px; border-radius: 50%; background: #6366F1; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 500; font-size: 13px;">МК</div>
      <div style="flex: 1; min-width: 0;">
        <p style="font-size: 14px; font-weight: 500; color: #F4F4F5; margin: 0;">Марина К.</p>
        <p style="font-size: 11px; color: #6366F1; margin: 1px 0 0; font-weight: 500;">⚡ semi_auto</p>
      </div>
      <button aria-label="досье" style="width: 32px; height: 32px; background: #1F1F28; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <i class="ti ti-id" style="font-size: 16px; color: #8B8B96;" aria-hidden="true"></i>
      </button>
      <button aria-label="настройки" style="width: 32px; height: 32px; background: #1F1F28; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <i class="ti ti-settings" style="font-size: 16px; color: #8B8B96;" aria-hidden="true"></i>
      </button>
    </div>

    <div style="flex: 1; padding: 14px 14px; display: flex; flex-direction: column; gap: 10px;">

      <div style="text-align: center;">
        <span style="font-size: 10px; color: #6B6B75; background: #1F1F28; padding: 3px 10px; border-radius: 10px;">сегодня</span>
      </div>

      <div style="max-width: 78%; background: #1F1F28; padding: 9px 12px; border-radius: 16px 16px 16px 4px; align-self: flex-start;">
        <p style="font-size: 13px; color: #F4F4F5; margin: 0; line-height: 1.4;">слушай, ты не забыл про завтра?</p>
        <p style="font-size: 9px; color: #6B6B75; margin: 3px 0 0; text-align: right;">12:01</p>
      </div>

      <div style="max-width: 78%; background: #6366F1; padding: 9px 12px; border-radius: 16px 16px 4px 16px; align-self: flex-end;">
        <p style="font-size: 13px; color: #FFFFFF; margin: 0; line-height: 1.4;">не забыл, в 19:00 на месте</p>
        <div style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 3px;">
          <i class="ti ti-sparkles" style="font-size: 9px; color: #C7D2FE;" aria-hidden="true"></i>
          <p style="font-size: 9px; color: #C7D2FE; margin: 0;">DoubleU · 12:02 ✓✓</p>
        </div>
      </div>

      <div style="max-width: 78%; background: #1F1F28; padding: 9px 12px; border-radius: 16px 16px 16px 4px; align-self: flex-start;">
        <p style="font-size: 13px; color: #F4F4F5; margin: 0; line-height: 1.4;">отлично, может зайдём ещё в то место?</p>
        <p style="font-size: 9px; color: #6B6B75; margin: 3px 0 0; text-align: right;">12:04</p>
      </div>

    </div>

    <div style="padding: 10px 12px; border-top: 0.5px solid #26262F; background: #14141A;">

      <div style="display: flex; align-items: center; gap: 6px; margin: 0 4px 6px;">
        <div style="width: 14px; height: 14px; border-radius: 50%; background: #6366F1; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-sparkles" style="font-size: 9px; color: #FFFFFF;" aria-hidden="true"></i>
        </div>
        <span style="font-size: 10px; font-weight: 500; color: #6366F1; text-transform: uppercase; letter-spacing: 0.5px;">черновик</span>
        <div style="flex: 1;"></div>
        <button aria-label="like" style="background: transparent; border: none; cursor: pointer; padding: 2px;">
          <i class="ti ti-thumb-up" style="font-size: 13px; color: #6B6B75;" aria-hidden="true"></i>
        </button>
        <button aria-label="dislike" style="background: transparent; border: none; cursor: pointer; padding: 2px;">
          <i class="ti ti-thumb-down" style="font-size: 13px; color: #6B6B75;" aria-hidden="true"></i>
        </button>
      </div>

      <div style="background: #1F1F28; border: 1px solid #6366F1; border-radius: 18px; padding: 10px 12px; margin-bottom: 8px;">
        <p style="font-size: 13px; color: #F4F4F5; margin: 0; line-height: 1.45;">давай, я не против. встретимся прямо там в 19:30?</p>
        <div style="display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid #26262F;">
          <button style="background: transparent; border: none; cursor: pointer; font-size: 11px; color: #8B8B96; padding: 2px 6px; display: flex; align-items: center; gap: 3px;">
            <i class="ti ti-edit" style="font-size: 12px;" aria-hidden="true"></i> править
          </button>
          <button style="background: transparent; border: none; cursor: pointer; font-size: 11px; color: #8B8B96; padding: 2px 6px; display: flex; align-items: center; gap: 3px;">
            <i class="ti ti-message-2" style="font-size: 12px;" aria-hidden="true"></i> уточнить
          </button>
          <button style="background: transparent; border: none; cursor: pointer; font-size: 11px; color: #8B8B96; padding: 2px 6px; display: flex; align-items: center; gap: 3px;">
            <i class="ti ti-refresh" style="font-size: 12px;" aria-hidden="true"></i> ещё
          </button>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button aria-label="отклонить" style="width: 38px; height: 38px; background: #1F1F28; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <i class="ti ti-trash" style="font-size: 16px; color: #8B8B96;" aria-hidden="true"></i>
        </button>
        <button style="flex: 1; background: #6366F1; color: #FFFFFF; border: none; padding: 10px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <i class="ti ti-send" style="font-size: 15px;" aria-hidden="true"></i> отправить
        </button>
      </div>

    </div>

  </div>
</div>
