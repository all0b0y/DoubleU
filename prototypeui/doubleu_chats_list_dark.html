<div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.5rem; display: flex; justify-content: center;">
  <div style="width: 320px; background: #14141A; border-radius: 28px; min-height: 620px; display: flex; flex-direction: column; border: 0.5px solid var(--color-border-tertiary); overflow: hidden;">

    <div style="padding: 20px 20px 12px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <p style="font-size: 11px; color: #6366F1; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;">DoubleU</p>
        <h2 style="font-size: 22px; font-weight: 500; color: #F4F4F5; margin: 2px 0 0; letter-spacing: -0.3px;">Чаты</h2>
      </div>
      <button aria-label="добавить чат" style="width: 36px; height: 36px; background: #6366F1; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <i class="ti ti-plus" style="font-size: 18px; color: #FFFFFF;" aria-hidden="true"></i>
      </button>
    </div>

    <div style="padding: 0 20px 12px;">
      <div style="background: #1F1F28; border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
        <i class="ti ti-search" style="font-size: 16px; color: #6B6B75;" aria-hidden="true"></i>
        <span style="font-size: 13px; color: #6B6B75;">поиск</span>
      </div>
    </div>

    <div style="flex: 1; padding: 0 12px; display: flex; flex-direction: column; gap: 2px;">

      <div style="padding: 12px; border-radius: 14px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #6366F1; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 500; font-size: 14px; flex-shrink: 0;">МК</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #F4F4F5;">Марина К.</span>
            <span style="font-size: 11px; color: #6B6B75;">сейчас</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 12px; color: #6366F1; font-weight: 500;">⚡ semi_auto</span>
            <span style="font-size: 12px; color: #8B8B96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">ок, подъеду к семи</span>
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-radius: 14px; display: flex; gap: 12px; align-items: center; background: #1F1F28;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #2A2A38; display: flex; align-items: center; justify-content: center; color: #F4F4F5; font-weight: 500; font-size: 14px; flex-shrink: 0;">Д</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #F4F4F5;">Дима</span>
            <span style="font-size: 11px; color: #6366F1; font-weight: 500; background: #2A2A38; padding: 1px 7px; border-radius: 8px;">3</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 12px; color: #F59E0B; font-weight: 500;">✋ manual</span>
            <span style="font-size: 12px; color: #8B8B96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">черновик готов</span>
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-radius: 14px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #2A2A38; display: flex; align-items: center; justify-content: center; color: #F4F4F5; font-weight: 500; font-size: 14px; flex-shrink: 0;">АП</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #F4F4F5;">Антон П.</span>
            <span style="font-size: 11px; color: #6B6B75;">12:04</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 12px; color: #6B6B75;">disabled</span>
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-radius: 14px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #2A2A38; display: flex; align-items: center; justify-content: center; color: #F4F4F5; font-weight: 500; font-size: 14px; flex-shrink: 0;">С</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #F4F4F5;">Соня</span>
            <span style="font-size: 11px; color: #6B6B75;">вчера</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 12px; color: #10B981; font-weight: 500;">⚡ auto</span>
            <span style="font-size: 12px; color: #8B8B96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">отправлено 4 ответа</span>
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-radius: 14px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: #2A2A38; display: flex; align-items: center; justify-content: center; color: #F4F4F5; font-weight: 500; font-size: 14px; flex-shrink: 0;">КЛ</div>
        <div style="flex: 1; min-width: 0;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 14px; font-weight: 500; color: #F4F4F5;">Костя Л.</span>
            <span style="font-size: 11px; color: #6B6B75;">сб</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
            <span style="font-size: 12px; color: #8B8B96; font-weight: 500;">silent</span>
            <span style="font-size: 12px; color: #8B8B96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">только наблюдение</span>
          </div>
        </div>
      </div>

    </div>

    <div style="border-top: 0.5px solid #26262F; padding: 10px 16px 14px; display: flex; justify-content: space-around; background: #14141A;">
      <button aria-label="чаты" style="background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0;">
        <i class="ti ti-messages" style="font-size: 20px; color: #6366F1;" aria-hidden="true"></i>
        <span style="font-size: 10px; color: #6366F1; font-weight: 500;">чаты</span>
      </button>
      <button aria-label="роли" style="background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0;">
        <i class="ti ti-masks-theater" style="font-size: 20px; color: #6B6B75;" aria-hidden="true"></i>
        <span style="font-size: 10px; color: #6B6B75;">роли</span>
      </button>
      <button aria-label="маркетплейс" style="background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0;">
        <i class="ti ti-shopping-bag" style="font-size: 20px; color: #6B6B75;" aria-hidden="true"></i>
        <span style="font-size: 10px; color: #6B6B75;">маркет</span>
      </button>
      <button aria-label="профиль" style="background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0;">
        <i class="ti ti-user" style="font-size: 20px; color: #6B6B75;" aria-hidden="true"></i>
        <span style="font-size: 10px; color: #6B6B75;">я</span>
      </button>
    </div>

  </div>
</div>
